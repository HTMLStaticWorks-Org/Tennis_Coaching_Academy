<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="courtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B3323"/>
      <stop offset="100%" stop-color="#051C13"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3DC82"/>
      <stop offset="100%" stop-color="#C99738"/>
    </linearGradient>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2FB38"/>
      <stop offset="100%" stop-color="#AEE118"/>
    </linearGradient>
  </defs>
  <!-- Rounded Base Shield -->
  <rect width="48" height="48" rx="14" fill="url(#courtGrad)" stroke="#1F543D" stroke-width="1.5"/>
  
  <!-- Crossed Rackets Crest -->
  <!-- Left Racket -->
  <ellipse cx="20" cy="19" rx="8" ry="11" transform="rotate(-30 20 19)" fill="none" stroke="url(#goldGrad)" stroke-width="1.8"/>
  <line x1="24.5" y1="27" x2="35" y2="40" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Right Racket -->
  <ellipse cx="28" cy="19" rx="8" ry="11" transform="rotate(30 28 19)" fill="none" stroke="url(#goldGrad)" stroke-width="1.8"/>
  <line x1="23.5" y1="27" x2="13" y2="40" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round"/>
  
  <!-- Tennis Ball in Center -->
  <circle cx="24" cy="20" r="4.8" fill="url(#ballGrad)" stroke="#0B3323" stroke-width="0.8"/>
  <path d="M 21.5 17 Q 24 19.5 21.5 22.5" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.85"/>
  <path d="M 26.5 17 Q 24 19.5 26.5 22.5" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.85"/>
  
  <!-- Laurel / Star Accent at Top -->
  <polygon points="24,6 25.5,9.5 29,9.5 26,11.5 27.5,15 24,13 20.5,15 22,11.5 19,9.5 22.5,9.5" fill="url(#goldGrad)"/>
</svg>
